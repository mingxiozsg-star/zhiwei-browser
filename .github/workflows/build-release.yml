name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ZW_KEYSTORE_BASE64 }}" | base64 -d > zhiwei-release.jks

      - name: Create keystore.properties
        run: |
          echo "storeFile=zhiwei-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.ZW_STORE_PASS }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ZW_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.ZW_KEY_PASS }}" >> keystore.properties

      - name: Remove local-only gradle properties
        run: sed -i '/aapt2FromMavenOverride/d;/aapt2.process.daemon/d' gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiwei-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
